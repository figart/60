---
layout: default
---
<article class="post update h-entry" itemscope itemtype="http://schema.org/BlogPosting">

<nav class="breadcrumb" aria-label="Breadcrumb">
  <a href="{{ '/updates/' | relative_url }}">Updates</a> <span aria-hidden="true">/</span> <span>{{ page.date | date: "%-d %b %Y" }}</span>
</nav>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">
      <span class="update-day">{{ page.date | date: "%A" }}</span> {{ page.date | date: "%-d %b %Y" }} · {{ page.date | date: "%-I:%M %p" }}
    </h1>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>
