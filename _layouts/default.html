<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <script>
      // Theme toggle functionality
      (function() {
        var toggle = document.getElementById('theme-toggle');
        if (toggle) {
          toggle.addEventListener('click', function() {
            var currentTheme = document.documentElement.getAttribute('data-theme');
            var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
          });
        }
      })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    <script>
      // Transform markdown images into figures with captions, and 3+ into carousels
      (function() {
        var content = document.querySelector('.post-content');
        if (!content) return;

        // Helper: create media element (img or YouTube iframe)
        // Syntax: ![caption](youtube:VIDEO_ID)
        function createMediaElement(img) {
          var src = (img.getAttribute('src') || '').trim();
          var youtubeMatch = src.match(/^youtube:([a-zA-Z0-9_-]+)/);

          if (youtubeMatch) {
            var iframe = document.createElement('iframe');
            iframe.src = 'https://www.youtube.com/embed/' + youtubeMatch[1];
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allowfullscreen', '');
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
            return iframe;
          } else {
            return img.cloneNode(true);
          }
        }

        // Helper: create figure with media and optional caption
        function createFigure(img, useWrapper) {
          var fig = document.createElement('figure');
          var media = createMediaElement(img);

          if (useWrapper) {
            var wrapper = document.createElement('div');
            wrapper.className = 'media-wrapper';
            wrapper.appendChild(media);
            fig.appendChild(wrapper);
          } else {
            fig.appendChild(media);
          }

          if (img.alt) {
            var caption = document.createElement('figcaption');
            caption.textContent = img.alt;
            fig.appendChild(caption);
          }
          return fig;
        }

        var paragraphs = Array.from(content.querySelectorAll('p'));
        var carouselIndex = 0;

        paragraphs.forEach(function(p) {
          var imgs = p.querySelectorAll('img');

          // Single or double images: convert to figure with caption
          if (imgs.length === 1 || imgs.length === 2) {
            var container = document.createDocumentFragment();
            imgs.forEach(function(img) {
              container.appendChild(createFigure(img, false));
            });
            p.parentNode.insertBefore(container, p);
            p.remove();
          }
          // 3+ images: convert to carousel
          else if (imgs.length >= 3) {
            var splide = document.createElement('div');
            splide.className = 'splide gallery-carousel';
            splide.id = 'carousel-' + carouselIndex;

            var track = document.createElement('div');
            track.className = 'splide__track';

            var list = document.createElement('ul');
            list.className = 'splide__list';

            imgs.forEach(function(img) {
              var slide = document.createElement('li');
              slide.className = 'splide__slide';
              var figure = createFigure(img, true);
              // Mark video slides for styling
              if (figure.querySelector('iframe')) {
                slide.classList.add('splide__slide--video');
              }
              slide.appendChild(figure);
              list.appendChild(slide);
            });

            track.appendChild(list);
            splide.appendChild(track);

            p.parentNode.insertBefore(splide, p);
            p.remove();

            new Splide('#carousel-' + carouselIndex, {
              type: 'slide',
              perPage: 1,
              gap: '1rem',
              arrows: true,
              pagination: true,
              rewind: true
            }).mount();

            carouselIndex++;
          }
        });
      })();
    </script>

    <script>
      // Lightbox functionality
      (function() {
        var content = document.querySelector('.post-content');
        if (!content) return;

        // Gallery state for carousel navigation
        // Each item: { type: 'image'|'video', src: string }
        var galleryItems = [];
        var currentIndex = 0;

        // Create lightbox overlay
        var overlay = document.createElement('div');
        overlay.className = 'lightbox-overlay';

        // Create container for media (img or iframe)
        var mediaContainer = document.createElement('div');
        mediaContainer.className = 'lightbox-media';
        overlay.appendChild(mediaContainer);

        // Create counter element
        var counter = document.createElement('span');
        counter.className = 'lightbox-counter';
        overlay.appendChild(counter);

        document.body.appendChild(overlay);

        // Update counter display
        function updateCounter() {
          if (galleryItems.length > 1) {
            counter.textContent = (currentIndex + 1) + ' / ' + galleryItems.length;
            counter.style.display = 'block';
          } else {
            counter.style.display = 'none';
          }
        }

        // Show current item in lightbox
        function showItem(index) {
          var item = galleryItems[index];
          mediaContainer.innerHTML = '';

          if (item.type === 'image') {
            var img = document.createElement('img');
            img.src = item.src;
            img.alt = item.alt || '';
            mediaContainer.appendChild(img);
          } else if (item.type === 'video') {
            var iframe = document.createElement('iframe');
            iframe.src = item.src;
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allowfullscreen', '');
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
            mediaContainer.appendChild(iframe);
          }

          updateCounter();
        }

        // Close lightbox on overlay click (but not on media click)
        overlay.addEventListener('click', function(e) {
          if (e.target === overlay) {
            overlay.classList.remove('active');
            // Stop any playing video
            mediaContainer.innerHTML = '';
          }
        });

        // Open lightbox when clicking on images or video wrappers
        content.addEventListener('click', function(e) {
          var figure = e.target.closest('figure');
          if (!figure) return;

          var img = figure.querySelector('img');
          var iframe = figure.querySelector('iframe');

          // Only open lightbox for images (videos play in carousel)
          if (img && e.target.tagName === 'IMG') {
            e.preventDefault();

            // Check if inside a carousel
            var carousel = figure.closest('.splide');
            if (carousel) {
              // Collect all media from this carousel
              galleryItems = [];
              carousel.querySelectorAll('.splide__slide').forEach(function(slide) {
                var slideImg = slide.querySelector('img');
                var slideIframe = slide.querySelector('iframe');
                if (slideImg) {
                  galleryItems.push({ type: 'image', src: slideImg.src, alt: slideImg.alt });
                } else if (slideIframe) {
                  galleryItems.push({ type: 'video', src: slideIframe.src });
                }
              });
              // Find index of clicked image
              currentIndex = galleryItems.findIndex(function(item) {
                return item.type === 'image' && item.src === img.src;
              });
              if (currentIndex === -1) currentIndex = 0;
            } else {
              // Single image mode
              galleryItems = [{ type: 'image', src: img.src, alt: img.alt }];
              currentIndex = 0;
            }

            showItem(currentIndex);
            overlay.classList.add('active');
          }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
          if (!overlay.classList.contains('active')) return;

          if (e.key === 'Escape') {
            overlay.classList.remove('active');
            mediaContainer.innerHTML = '';
          }
          if (e.key === 'ArrowRight' && galleryItems.length > 1) {
            currentIndex = (currentIndex + 1) % galleryItems.length;
            showItem(currentIndex);
          }
          if (e.key === 'ArrowLeft' && galleryItems.length > 1) {
            currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
            showItem(currentIndex);
          }
        });
      })();
    </script>

  </body>

</html>
