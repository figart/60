<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>
    <!-- Google Tag Manager (noscript) -->

    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    {%- include contact-modal.html -%}

    <script>
      // Theme toggle functionality
      (function() {
        var toggle = document.getElementById('theme-toggle');
        if (toggle) {
          toggle.addEventListener('click', function() {
            var currentTheme = document.documentElement.getAttribute('data-theme');
            var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
          });
        }
      })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    <script>
      // Transform markdown images into figures with captions, and 3+ into carousels
      (function() {
        var content = document.querySelector('.post-content');
        if (!content) return;

        // Helper: create media element (img or YouTube iframe)
        // Syntax: ![caption](#youtube:VIDEO_ID)
        function createMediaElement(img) {
          var src = (img.getAttribute('src') || '').trim();
          var youtubeMatch = src.match(/^#youtube:([a-zA-Z0-9_-]+)/);

          if (youtubeMatch) {
            var iframe = document.createElement('iframe');
            iframe.src = 'https://www.youtube.com/embed/' + youtubeMatch[1];
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allowfullscreen', '');
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
            return iframe;
          } else {
            return img.cloneNode(true);
          }
        }

        // Helper: create figure with media and optional caption
        function createFigure(img, useWrapper) {
          var fig = document.createElement('figure');
          var media = createMediaElement(img);

          if (useWrapper) {
            var wrapper = document.createElement('div');
            wrapper.className = 'media-wrapper';
            wrapper.appendChild(media);
            fig.appendChild(wrapper);
          } else {
            fig.appendChild(media);
          }

          if (img.alt) {
            var caption = document.createElement('figcaption');
            caption.textContent = img.alt;
            fig.appendChild(caption);
          }
          return fig;
        }

        var paragraphs = Array.from(content.querySelectorAll('p'));
        var carouselIndex = 0;
        var figureIndex = 0;

        paragraphs.forEach(function(p) {
          var imgs = p.querySelectorAll('img');

          // Single or double images: convert to figure with caption
          if (imgs.length === 1 || imgs.length === 2) {
            var container = document.createDocumentFragment();
            imgs.forEach(function(img) {
              var fig = createFigure(img, false);
              fig.setAttribute('data-figure-index', figureIndex);
              figureIndex++;
              container.appendChild(fig);
            });
            p.parentNode.insertBefore(container, p);
            p.remove();
          }
          // 3+ images: convert to carousel
          else if (imgs.length >= 3) {
            var splide = document.createElement('div');
            splide.className = 'splide gallery-carousel';
            splide.id = 'carousel-' + carouselIndex;

            var track = document.createElement('div');
            track.className = 'splide__track';

            var list = document.createElement('ul');
            list.className = 'splide__list';

            var slideIndex = 0;
            imgs.forEach(function(img) {
              var slide = document.createElement('li');
              slide.className = 'splide__slide';
              slide.setAttribute('data-slide-index', slideIndex);
              slideIndex++;
              var figure = createFigure(img, true);
              // Mark video slides for styling
              if (figure.querySelector('iframe')) {
                slide.classList.add('splide__slide--video');
              }
              slide.appendChild(figure);
              list.appendChild(slide);
            });

            track.appendChild(list);
            splide.appendChild(track);

            p.parentNode.insertBefore(splide, p);
            p.remove();

            var splideInstance = new Splide('#carousel-' + carouselIndex, {
              type: 'slide',
              perPage: 1,
              gap: '1rem',
              arrows: true,
              pagination: true,
              rewind: true
            }).mount();
            // Store instance on element for lightbox syncing
            splide.splide = splideInstance;

            carouselIndex++;
          }
        });
      })();
    </script>

    <script>
      // Lightbox functionality
      (function() {
        var content = document.querySelector('.post-content');
        if (!content) return;

        // Gallery state for carousel navigation
        // Each item: { type: 'image'|'video', src: string }
        var galleryItems = [];
        var currentIndex = 0;
        var currentSplide = null; // Reference to the carousel's Splide instance
        var currentCarouselIndex = null; // Carousel index when in carousel mode
        var currentFigureIndex = null; // Figure index when in single-image mode

        // Image cache for preloading
        var imageCache = {};

        function preloadImage(src) {
          // Only preload valid http(s) URLs
          if (!src || !src.match(/^https?:\/\//)) return null;
          if (imageCache[src]) return imageCache[src];
          var img = new Image();
          img.src = src;
          imageCache[src] = img;
          return img;
        }

        function preloadAdjacent(index) {
          // Preload prev, current, next images
          var indices = [
            index,
            (index + 1) % galleryItems.length,
            (index - 1 + galleryItems.length) % galleryItems.length
          ];
          indices.forEach(function(i) {
            var item = galleryItems[i];
            if (item && item.type === 'image') {
              preloadImage(item.src);
            }
          });
        }

        // URL hash utilities for deep linking
        function updateUrlHash() {
          var hash = '';
          if (currentCarouselIndex !== null) {
            hash = '#gallery-' + currentCarouselIndex + '-' + currentIndex;
          } else if (currentFigureIndex !== null) {
            hash = '#image-' + currentFigureIndex;
          }
          if (hash) {
            history.replaceState(null, '', hash);
          }
        }

        function clearUrlHash() {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }

        function parseUrlHash() {
          var hash = window.location.hash;
          if (!hash) return null;

          // Match #gallery-{carouselIndex}-{slideIndex}
          var galleryMatch = hash.match(/^#gallery-(\d+)-(\d+)$/);
          if (galleryMatch) {
            return {
              type: 'gallery',
              carouselIndex: parseInt(galleryMatch[1], 10),
              slideIndex: parseInt(galleryMatch[2], 10)
            };
          }

          // Match #image-{figureIndex}
          var imageMatch = hash.match(/^#image-(\d+)$/);
          if (imageMatch) {
            return {
              type: 'image',
              figureIndex: parseInt(imageMatch[1], 10)
            };
          }

          return null;
        }

        // Create lightbox overlay
        var overlay = document.createElement('div');
        overlay.className = 'lightbox-overlay';

        // Create content wrapper for positioning media and caption together
        var contentWrapper = document.createElement('div');
        contentWrapper.className = 'lightbox-content';
        overlay.appendChild(contentWrapper);

        // Create container for media (img or iframe)
        var mediaContainer = document.createElement('div');
        mediaContainer.className = 'lightbox-media';
        contentWrapper.appendChild(mediaContainer);

        // Create spinner element
        var spinner = document.createElement('div');
        spinner.className = 'lightbox-spinner';
        mediaContainer.appendChild(spinner);

        // Create caption element (positioned at bottom of content wrapper)
        var captionEl = document.createElement('div');
        captionEl.className = 'lightbox-caption';
        contentWrapper.appendChild(captionEl);

        // Create counter element
        var counter = document.createElement('span');
        counter.className = 'lightbox-counter';
        overlay.appendChild(counter);

        // Create close button
        var closeBtn = document.createElement('button');
        closeBtn.className = 'lightbox-close';
        closeBtn.innerHTML = '&times;';
        closeBtn.setAttribute('aria-label', 'Close lightbox');
        overlay.appendChild(closeBtn);

        // Create navigation arrows
        var prevBtn = document.createElement('button');
        prevBtn.className = 'lightbox-arrow lightbox-arrow--prev';
        prevBtn.innerHTML = '&#10094;';
        prevBtn.setAttribute('aria-label', 'Previous image');
        overlay.appendChild(prevBtn);

        var nextBtn = document.createElement('button');
        nextBtn.className = 'lightbox-arrow lightbox-arrow--next';
        nextBtn.innerHTML = '&#10095;';
        nextBtn.setAttribute('aria-label', 'Next image');
        overlay.appendChild(nextBtn);

        document.body.appendChild(overlay);

        // Arrow click handlers
        prevBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (galleryItems.length > 1) {
            currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
            showItem(currentIndex);
          }
        });

        nextBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (galleryItems.length > 1) {
            currentIndex = (currentIndex + 1) % galleryItems.length;
            showItem(currentIndex);
          }
        });

        // Update counter and arrows display
        function updateCounter() {
          if (galleryItems.length > 1) {
            counter.textContent = (currentIndex + 1) + ' / ' + galleryItems.length;
            counter.style.display = 'block';
            prevBtn.style.display = 'flex';
            nextBtn.style.display = 'flex';
          } else {
            counter.style.display = 'none';
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
          }
        }

        // Show/hide caption with fade, positioned at bottom of media element
        function showCaption(text, mediaElement) {
          if (text && mediaElement) {
            captionEl.textContent = text;

            // Poll until media element has valid dimensions
            var attempts = 0;
            var maxAttempts = 20;

            function positionCaption() {
              var mediaRect = mediaElement.getBoundingClientRect();

              // Check if we have valid dimensions (width > 100px to avoid partial renders)
              if (mediaRect.width > 100 && mediaRect.height > 100) {
                var containerRect = contentWrapper.getBoundingClientRect();
                var bottomOffset = containerRect.bottom - mediaRect.bottom;
                captionEl.style.bottom = bottomOffset + 'px';
                captionEl.style.left = (mediaRect.left - containerRect.left) + 'px';
                captionEl.style.width = mediaRect.width + 'px';
                captionEl.style.display = 'block';

                // Delay before fade-in to let image settle and ensure smooth transition
                setTimeout(function() {
                  captionEl.classList.add('visible');
                }, 100);
              } else if (attempts < maxAttempts) {
                attempts++;
                setTimeout(positionCaption, 50);
              }
            }

            // Start positioning after a short delay
            setTimeout(positionCaption, 200);
          } else {
            captionEl.classList.remove('visible');
            captionEl.style.display = 'none';
          }
        }

        function hideCaption() {
          captionEl.classList.remove('visible');
          captionEl.style.display = 'none';
        }

        // Show current item in lightbox
        function showItem(index) {
          var item = galleryItems[index];

          // Remove any existing iframes immediately (no crossfade for videos)
          var existingIframes = mediaContainer.querySelectorAll('iframe');
          existingIframes.forEach(function(iframe) { iframe.remove(); });

          // Mark existing images as outgoing (fade out, but keep scale)
          var existingImgs = mediaContainer.querySelectorAll('img:not(.outgoing)');
          existingImgs.forEach(function(img) {
            img.classList.add('outgoing');
          });

          // Hide caption during transition
          hideCaption();

          if (item.type === 'image') {
            // Show spinner
            spinner.classList.add('visible');

            var img = document.createElement('img');
            img.alt = item.alt || '';

            // Check if image is already cached and loaded
            var cached = imageCache[item.src];
            if (cached && cached.complete && cached.naturalWidth > 0) {
              img.src = item.src;
              mediaContainer.appendChild(img);
              // Use requestAnimationFrame to ensure the element is in DOM before adding loaded class
              requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                  spinner.classList.remove('visible');
                  img.classList.add('loaded');
                  showCaption(item.alt, img);
                  // Remove outgoing images after transition
                  setTimeout(function() {
                    var outgoing = mediaContainer.querySelectorAll('.outgoing');
                    outgoing.forEach(function(el) { el.remove(); });
                  }, 500);
                });
              });
            } else {
              img.onload = function() {
                spinner.classList.remove('visible');
                img.classList.add('loaded');
                showCaption(item.alt, img);
                // Remove outgoing images after transition
                setTimeout(function() {
                  var outgoing = mediaContainer.querySelectorAll('.outgoing');
                  outgoing.forEach(function(el) { el.remove(); });
                }, 500);
              };
              img.onerror = function() {
                spinner.classList.remove('visible');
                // Still show image (broken state) and caption
                img.classList.add('loaded');
                showCaption(item.alt, img);
              };
              img.src = item.src;
              mediaContainer.appendChild(img);
            }
          } else if (item.type === 'video') {
            // Remove all existing images for video
            var allImgs = mediaContainer.querySelectorAll('img');
            allImgs.forEach(function(el) { el.remove(); });
            spinner.classList.remove('visible');

            var iframe = document.createElement('iframe');
            iframe.src = item.src;
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allowfullscreen', '');
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
            mediaContainer.appendChild(iframe);
            showCaption(item.alt, iframe);
          }

          updateCounter();
          preloadAdjacent(index);

          // Sync carousel with lightbox position
          if (currentSplide) {
            currentSplide.go(index);
          }

          // Update URL hash for deep linking
          updateUrlHash();
        }

        // Close lightbox and clean up
        function closeLightbox() {
          overlay.classList.remove('active');
          hideCaption();
          clearUrlHash();
          currentCarouselIndex = null;
          currentFigureIndex = null;
          // Wait for overlay fade-out transition before cleaning up
          setTimeout(function() {
            // Remove all images and iframes (but keep spinner)
            var media = mediaContainer.querySelectorAll('img, iframe');
            media.forEach(function(el) { el.remove(); });
            spinner.classList.remove('visible');
          }, 300);
        }

        // Close lightbox on overlay click (but not on media click)
        // Close lightbox on any click
        overlay.addEventListener('click', function(e) {
          closeLightbox();
        });

        // Open lightbox when clicking on images or video wrappers
        content.addEventListener('click', function(e) {
          // Disable lightbox on mobile screens
          if (window.innerWidth < 480) return;

          var figure = e.target.closest('figure');
          if (!figure) return;

          var img = figure.querySelector('img');
          var iframe = figure.querySelector('iframe');

          // Only open lightbox for images (videos play in carousel)
          if (img && e.target.tagName === 'IMG') {
            e.preventDefault();

            // Check if inside a carousel
            var carousel = figure.closest('.splide');
            if (carousel) {
              // Store reference to Splide instance for syncing
              currentSplide = carousel.splide || null;
              // Extract carousel index from id (e.g., "carousel-0" -> 0)
              var carouselId = carousel.id;
              var carouselMatch = carouselId.match(/^carousel-(\d+)$/);
              currentCarouselIndex = carouselMatch ? parseInt(carouselMatch[1], 10) : null;
              currentFigureIndex = null;
              // Collect all media from this carousel
              galleryItems = [];
              carousel.querySelectorAll('.splide__slide').forEach(function(slide) {
                var slideImg = slide.querySelector('img');
                var slideIframe = slide.querySelector('iframe');
                var figcaption = slide.querySelector('figcaption');
                var caption = figcaption ? figcaption.textContent : '';
                // Check for iframe first, or if img has #youtube: src treat as video
                if (slideIframe) {
                  galleryItems.push({ type: 'video', src: slideIframe.src, alt: caption });
                } else if (slideImg && !slideImg.src.match(/#youtube:/)) {
                  galleryItems.push({ type: 'image', src: slideImg.src, alt: slideImg.alt || caption });
                }
              });
              // Find index of clicked image
              currentIndex = galleryItems.findIndex(function(item) {
                return item.type === 'image' && item.src === img.src;
              });
              if (currentIndex === -1) currentIndex = 0;
            } else {
              // Single image mode
              currentSplide = null;
              currentCarouselIndex = null;
              currentFigureIndex = parseInt(figure.getAttribute('data-figure-index'), 10);
              galleryItems = [{ type: 'image', src: img.src, alt: img.alt }];
              currentIndex = 0;
            }

            // Preload all gallery images when lightbox opens
            galleryItems.forEach(function(item) {
              if (item.type === 'image') {
                preloadImage(item.src);
              }
            });

            showItem(currentIndex);
            overlay.classList.add('active');
          }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
          if (!overlay.classList.contains('active')) return;

          if (e.key === 'Escape') {
            closeLightbox();
          }
          if (e.key === 'ArrowRight' && galleryItems.length > 1) {
            currentIndex = (currentIndex + 1) % galleryItems.length;
            showItem(currentIndex);
          }
          if (e.key === 'ArrowLeft' && galleryItems.length > 1) {
            currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
            showItem(currentIndex);
          }
        });

        // Open lightbox to a specific hash target
        function openToHashTarget(target) {
          // Disable on mobile
          if (window.innerWidth < 480) return;

          if (target.type === 'gallery') {
            // Find the carousel element
            var carousel = document.getElementById('carousel-' + target.carouselIndex);
            if (!carousel) return;

            var slides = carousel.querySelectorAll('.splide__slide');
            if (slides.length === 0) return;

            // Validate slide index, default to 0 if out of range
            var slideIndex = target.slideIndex;
            if (slideIndex < 0 || slideIndex >= slides.length) {
              slideIndex = 0;
            }

            // Set up carousel state
            currentSplide = carousel.splide || null;
            currentCarouselIndex = target.carouselIndex;
            currentFigureIndex = null;

            // Build gallery items from carousel
            galleryItems = [];
            slides.forEach(function(slide) {
              var slideImg = slide.querySelector('img');
              var slideIframe = slide.querySelector('iframe');
              var figcaption = slide.querySelector('figcaption');
              var caption = figcaption ? figcaption.textContent : '';
              if (slideIframe) {
                galleryItems.push({ type: 'video', src: slideIframe.src, alt: caption });
              } else if (slideImg && !slideImg.src.match(/#youtube:/)) {
                galleryItems.push({ type: 'image', src: slideImg.src, alt: slideImg.alt || caption });
              }
            });

            if (galleryItems.length === 0) return;

            // Preload all gallery images
            galleryItems.forEach(function(item) {
              if (item.type === 'image') {
                preloadImage(item.src);
              }
            });

            currentIndex = Math.min(slideIndex, galleryItems.length - 1);
            showItem(currentIndex);
            overlay.classList.add('active');

          } else if (target.type === 'image') {
            // Find the figure with matching data-figure-index
            var figure = content.querySelector('figure[data-figure-index="' + target.figureIndex + '"]');
            if (!figure) return;

            var img = figure.querySelector('img');
            if (!img) return;

            // Set up single image state
            currentSplide = null;
            currentCarouselIndex = null;
            currentFigureIndex = target.figureIndex;
            galleryItems = [{ type: 'image', src: img.src, alt: img.alt }];
            currentIndex = 0;

            preloadImage(img.src);
            showItem(currentIndex);
            overlay.classList.add('active');
          }
        }

        // Handle browser back/forward navigation
        window.addEventListener('hashchange', function() {
          var target = parseUrlHash();
          if (target) {
            // If lightbox is already open, just navigate to new target
            if (overlay.classList.contains('active')) {
              // Close and reopen to ensure clean state
              overlay.classList.remove('active');
              setTimeout(function() {
                openToHashTarget(target);
              }, 50);
            } else {
              openToHashTarget(target);
            }
          } else {
            // Hash cleared or invalid, close lightbox if open
            if (overlay.classList.contains('active')) {
              closeLightbox();
            }
          }
        });

        // Check for hash on page load
        var initialTarget = parseUrlHash();
        if (initialTarget) {
          // Delay slightly to ensure DOM is fully ready
          setTimeout(function() {
            openToHashTarget(initialTarget);
          }, 100);
        }
      })();
    </script>

    <script>
      // Contact modal functionality
      (function() {
        var modal = document.getElementById('contact-modal');
        var toggle = document.getElementById('contact-toggle');
        if (!modal || !toggle) return;

        var closeBtn = modal.querySelector('.contact-modal-close');
        var form = document.getElementById('contact-form');
        var successEl = document.getElementById('contact-success');
        var errorEl = document.getElementById('contact-error');
        var retryBtn = document.getElementById('contact-retry');

        function openModal() {
          modal.classList.add('active');
          document.body.style.overflow = 'hidden';
        }

        function closeModal() {
          modal.classList.remove('active');
          document.body.style.overflow = '';
        }

        function resetForm() {
          form.reset();
          form.style.display = 'block';
          successEl.style.display = 'none';
          errorEl.style.display = 'none';
        }

        // Open modal on contact toggle click
        if (toggle) {
          toggle.addEventListener('click', openModal);
        }

        // Open modal on .contact-link click
        document.addEventListener('click', function(e) {
          if (e.target.closest('.contact-link')) {
            e.preventDefault();
            openModal();
          }
        });

        // Close modal handlers
        closeBtn.addEventListener('click', function() {
          closeModal();
          setTimeout(resetForm, 300);
        });

        modal.addEventListener('click', function(e) {
          if (e.target === modal) {
            closeModal();
            setTimeout(resetForm, 300);
          }
        });

        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && modal.classList.contains('active')) {
            closeModal();
            setTimeout(resetForm, 300);
          }
        });

        // Form submission
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          var formData = new FormData(form);
          var submitBtn = form.querySelector('.contact-submit');
          submitBtn.disabled = true;
          submitBtn.textContent = 'Sending...';

          fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: formData
          })
          .then(function(response) {
            return response.json();
          })
          .then(function(data) {
            if (data.success) {
              form.style.display = 'none';
              successEl.style.display = 'block';
            } else {
              form.style.display = 'none';
              errorEl.style.display = 'block';
            }
          })
          .catch(function() {
            form.style.display = 'none';
            errorEl.style.display = 'block';
          })
          .finally(function() {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Message';
          });
        });

        // Retry button
        retryBtn.addEventListener('click', function() {
          resetForm();
        });
      })();
    </script>

  </body>

</html>
