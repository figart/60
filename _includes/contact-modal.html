<div class="contact-modal-overlay" id="contact-modal">
  <div class="contact-modal">
    <button class="contact-modal-close" aria-label="Close contact form">&times;</button>

    <form action="https://api.web3forms.com/submit" method="POST" class="contact-form" id="contact-form">
      <input type="hidden" name="access_key" value="c4764d10-491a-45c6-a8eb-8fb2d86031f0">
      <input type="hidden" name="subject" value="New contact from {{ site.title }}">
      <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

      <h2>Get in Touch with Mark</h2>

      <div class="form-group">
        <label for="contact-name">Name</label>
        <input type="text" id="contact-name" name="name" required>
      </div>

      <div class="form-group">
        <label for="contact-email">Email</label>
        <input type="email" id="contact-email" name="email" required>
      </div>

      <div class="form-group">
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit" class="contact-submit">Send Message</button>
    </form>

    <div class="contact-success" id="contact-success">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
      </svg>
      <h2>Message Sent!</h2>
      <p>Thanks for reaching out. I'll get back to you soon.</p>
    </div>

    <div class="contact-error" id="contact-error">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <h2>Something went wrong</h2>
      <p>Please try again or email me directly.</p>
      <button class="contact-retry" id="contact-retry">Try Again</button>
    </div>
  </div>
</div>
