{%- comment -%}
  BreadcrumbList with Home → optional parent → current page.
  Params: parent_name, parent_url (optional), current_name
{%- endcomment -%}
{%- if include.current_name -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ "/" | absolute_url | jsonify }}
    }{% if include.parent_name %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ include.parent_name | jsonify }},
      "item": {{ include.parent_url | absolute_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ include.current_name | jsonify }}
    }{% else %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ include.current_name | jsonify }}
    }{% endif %}
  ]
}
</script>
{%- endif -%}
